{% extends "panel/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form class="tarjeta" method="post" novalidate>
  {% csrf_token %}
  {% include "panel/_campos.html" %}
  <div class="botones">
    <button class="btn" type="submit">Guardar</button>
    <a class="btn sec" href="{% url 'panel_categorias' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
