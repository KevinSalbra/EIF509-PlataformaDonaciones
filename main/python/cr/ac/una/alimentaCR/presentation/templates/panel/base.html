<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Panel{% endblock %} · AlimentaCR</title>
  <style>
    {% include "panel/_estilos.css" %}
  </style>
</head>
<body>
  <header>
    <div class="barra">
      <span class="marca"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>AlimentaCR <small>Administración</small></span>
      {% if request.usuario_panel %}
      <nav aria-label="Secciones">
        <a href="{% url 'panel_categorias' %}"{% if seccion == 'categorias' %} aria-current="page"{% endif %}>Categorías</a>
        <a href="{% url 'panel_organizaciones' %}"{% if seccion == 'organizaciones' %} aria-current="page"{% endif %}>Organizaciones</a>
      </nav>
      <form class="salir" method="post" action="{% url 'panel_logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión ({{ request.usuario_panel.nombre }})</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% for mensaje in messages %}
      <div class="mensaje {{ mensaje.tags }}" role="status">{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
