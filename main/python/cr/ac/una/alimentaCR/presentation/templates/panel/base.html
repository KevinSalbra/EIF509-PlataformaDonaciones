<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Panel{% endblock %} · AlimentaCR</title>
  <style>
    :root {
      --tinta: #1d2b24; --suave: #5d6b63; --papel: #f5f6f2; --tarjeta: #ffffff;
      --linea: #d9ddd5; --verde: #1b6b49; --verde-osc: #14513a; --rojo: #a3261c;
      --rojo-fondo: #fbeceb; --ok-fondo: #e4f3ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --tinta: #e8ece6; --suave: #a2aea6; --papel: #141a16; --tarjeta: #1c241f;
        --linea: #33403a; --verde: #4cb88a; --verde-osc: #6fd0a5; --rojo: #ff8f84;
        --rojo-fondo: #3a1d1b; --ok-fondo: #1c3327;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--papel); color: var(--tinta);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--tarjeta); border-bottom: 1px solid var(--linea); }
    .barra { max-width: 62rem; margin: 0 auto; padding: .75rem 1rem;
             display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    .marca { font-weight: 700; margin-right: auto; }
    nav a { color: var(--suave); text-decoration: none; padding: .25rem .5rem; border-radius: 4px; }
    nav a[aria-current="page"] { color: var(--tinta); font-weight: 600; box-shadow: inset 0 -2px var(--verde); }
    main { max-width: 62rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .acciones { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .acciones h1 { margin: 0; }
    .btn { display: inline-block; background: var(--verde); color: #fff; border: 0; border-radius: 6px;
           padding: .5rem .9rem; font: inherit; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--verde-osc); }
    .btn.sec { background: transparent; color: var(--tinta); border: 1px solid var(--linea); }
    .btn.sec:hover { background: var(--linea); }
    :focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
    .tabla-contenedor { overflow-x: auto; background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--linea); vertical-align: top; }
    th { font-size: .85rem; color: var(--suave); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .etiqueta { font-size: .8rem; padding: .1rem .5rem; border-radius: 999px; border: 1px solid var(--linea); white-space: nowrap; }
    .vacio { padding: 2rem 1rem; text-align: center; color: var(--suave); }
    .paginacion { display: flex; gap: .75rem; align-items: center; justify-content: center; margin-top: 1rem; color: var(--suave); }
    .mensaje { padding: .6rem .9rem; border-radius: 6px; margin-bottom: 1rem; background: var(--ok-fondo); }
    .mensaje.error { background: var(--rojo-fondo); color: var(--rojo); }
    form.tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 8px;
                   padding: 1.25rem; max-width: 36rem; }
    .campo { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input[type=text], input[type=email], input[type=password], select, textarea {
      width: 100%; padding: .5rem .6rem; font: inherit; color: var(--tinta);
      background: var(--papel); border: 1px solid var(--linea); border-radius: 6px; }
    .ayuda { color: var(--suave); font-size: .85rem; margin-top: .2rem; }
    .error-campo { color: var(--rojo); font-size: .9rem; margin: .25rem 0 0; padding: 0; list-style: none; }
    .botones { display: flex; gap: .5rem; margin-top: 1.25rem; }
    .salir { display: inline; }
    .salir button { background: none; border: 0; color: var(--suave); font: inherit; cursor: pointer; padding: .25rem .5rem; }
  </style>
</head>
<body>
  <header>
    <div class="barra">
      <span class="marca">AlimentaCR · Administración</span>
      {% if request.usuario_panel %}
      <nav aria-label="Secciones">
        <a href="{% url 'panel_categorias' %}"{% if seccion == 'categorias' %} aria-current="page"{% endif %}>Categorías</a>
        <a href="{% url 'panel_organizaciones' %}"{% if seccion == 'organizaciones' %} aria-current="page"{% endif %}>Organizaciones</a>
      </nav>
      <form class="salir" method="post" action="{% url 'panel_logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión ({{ request.usuario_panel.nombre }})</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% for mensaje in messages %}
      <div class="mensaje {{ mensaje.tags }}" role="status">{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
