{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Paginación">
  {% if pagina.has_previous %}
    <a class="btn sec" href="?page={{ pagina.previous_page_number }}">Anterior</a>
  {% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>
  {% if pagina.has_next %}
    <a class="btn sec" href="?page={{ pagina.next_page_number }}">Siguiente</a>
  {% endif %}
</nav>
{% endif %}
